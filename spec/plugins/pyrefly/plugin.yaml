name: pyrefly
description: "Блокирующий typecheck задачи на post_review — до фиксации evidence"
version: "1.0"
hooks:
  # Точка выбрана не по удобству, а по единственной, где typecheck возможен.
  # В `commands.test` его нет: `execution_mode: tdd` отвергает композитный
  # test_command целиком. В `commands.lint` тоже нет: RED-фаза гоняет
  # композитный lint ЦЕЛИКОМ перед заморозкой файла (`_lint_claimed`), а на
  # RED-дереве реализации ещё нет — проектный pyrefly там красный по
  # построению и отказывал бы каждый red.
  #
  # Имя плагина `pyrefly` сортируется раньше `tdd-evidence`, а хуки одной
  # точки исполняются в алфавитном порядке имён (`discover_plugins`). Порядок
  # значим: ошибка типизации обязана останавливать задачу ДО того, как
  # evidence зафиксирует её как состоявшуюся цепочку.
  post_review:
    command: 'cd "$SR_PROJECT_ROOT" && uv run pyrefly check'
    # Оплаченный урок волны 1: typecheck стоял только на приёмке, типовой долг
    # копился 22 задачи и вскрылся четырьмя ошибками в тестах, которые к тому
    # моменту были byte-locked — неисправимы без операторской санкции.
    blocking: true
