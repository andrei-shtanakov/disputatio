# Эталон операторского конфига workstream'а. Живой файл
# (`spec-runner.config.yaml`) gitignored — в нём локальные пути. Требования и
# их обоснование: docs/workstream-setup.md.
executor:
  auto_commit: true
  claude_command: claude
  claude_model: ''
  commands:
    # lint сужается до замораживаемого файла, если команда НЕ композитная —
    # поэтому здесь ровно ruff. Обоснование и место для pyrefly:
    # docs/workstream-setup.md §1.
    lint: uv run ruff check .
    # Ровно одна команда: `execution_mode: tdd` отвергает композитный
    # test_command (реплей не угадывает, какой компонент принимает node id).
    test: uv run pytest -q
  # Штатный TDD-контракт (D7-A → spec-runner#141); локальный гейт удалён
  # после прогона-доказательства 2026-08-22.
  execution_mode: tdd
  tdd_runner: pytest
  harness_files:
  # Control-plane: дефолтный HARNESS_CANDIDATES их не включает, а агент
  # работает в worktree и технически может изменить саму политику
  # (spec-runner#137). Самого TDD-гейта здесь нет — он код установленного
  # пакета, агенту его править нечем.
  - spec-runner.config.yaml
  - pyrefly.toml
  - scripts/tdd_evidence_export.py
  - spec/plugins
  - spec/evidence
  # Архив сертификации волны 1: писать некому, править нельзя.
  - spec/.tdd-evidence/verdicts
  - spec/.tdd-evidence/waivers
  - spec/.tdd-evidence/abandoned
  - spec/.tdd-evidence/repairs
  - spec/maestro-constitution.md
  harness_guard: strict
  hooks:
    post_done:
      auto_commit: true
      run_lint: true
      run_tests: true
    pre_start:
      create_git_branch: false
  main_branch: ws/<workstream-id>
  max_retries: 3
  on_task_failure: stop        # объявление намерения, НЕ гарантия (spec-runner#136)
  review_command: ''
  review_model: ''
  spec_prefix: maestro-
  task_timeout_minutes: 30
