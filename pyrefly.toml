# ВНИМАНИЕ: при наличии этого файла блок [tool.pyrefly] в pyproject.toml
# игнорируется целиком (pyrefly не мёржит конфиги) — этот файл в приоритете.
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
search-path = ["scripts", "tests"]

# Контрактные тесты намеренно присваивают в поля frozen-моделей и проверяют
# ValidationError; тест-файлы после red-чекпоинта байт-неизменяемы, поэтому
# inline-suppression недоступен — отключаем read-only точечно, только для
# фактически нуждающихся файлов (test_base.py, test_validation.py).
# unexpected-keyword остаётся только у test_validation.py: его негативные
# тесты extra="forbid" передают заведомо лишний литеральный kwarg и ждут
# ValidationError; в test_base.py лишние поля идут через model_validate с
# dict-payload, статике ловить нечего — релаксация снята (TASK-025).
# Новые тест-файлы ревизии 2 пишутся под строгий pyrefly (негативные
# сценарии — model_validate с dict-payload) и послаблений не получают
# (DESIGN-015).
[[sub-config]]
matches = "tests/contracts/test_base.py"

[sub-config.errors]
read-only = false

[[sub-config]]
matches = "tests/contracts/test_validation.py"

[sub-config.errors]
read-only = false
unexpected-keyword = false
