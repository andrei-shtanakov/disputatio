[project]
name = "disputatio"
version = "0.1.0"
description = "Headless author↔reviewer debate-loop orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputatio"]

[tool.ruff]
line-length = 88
extend-exclude = [".claude/skills/spec-generator-skill/templates"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
# ВНИМАНИЕ: при наличии pyrefly.toml этот блок игнорируется целиком (pyrefly
# не мёржит конфиги); реальный конфиг — pyrefly.toml
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
