[project]
name = "disputatio"
version = "0.1.0"
description = "Headless author↔reviewer debate-loop orchestrator"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
disp = "disputatio.cli:main"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    "types-pyyaml>=6.0.12.20260724",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/disputatio"]

[tool.ruff]
line-length = 88
extend-exclude = [
    ".claude/skills/spec-generator-skill/templates",
    "docs/**/*.md",
    "*.md",
]

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
