# =============================================================================
# disputatio — Maestro Mode-2 конфигурация (рукописная)
# =============================================================================
# SSOT для worktree-конфигов: spec-runner.config.yaml генерируется Maestro
# в каждом worktree из блока spec_runner ниже и НЕ трекается (dual-mode
# contract). Оракул декомпозиции: docs/plans/D1-decomposition-invariants.md.
#
# Запуск:
#   maestro validate project.yaml --strict   # preflight
#   maestro orchestrate project.yaml         # прогон
#
# СОСТАВ WORKSTREAM'ОВ = ТЕКУЩАЯ ВОЛНА, а не история. `orchestrate` не умеет
# фильтровать по workstream'у (в CLI такого флага нет) и берёт весь список,
# поэтому конфиг описывает то, что гоним сейчас. Волна 1 (семь workstream'ов,
# 100 задач) закрыта и влита PR #11; её состав — в git-истории этого файла
# (до коммита cutover'а) и в транскриптах `docs/plans/`. Текущая волна —
# прогон-доказательство миграции TDD-гейта на штатный режим
# (`todo://disputatio/tdd-gate-migration-proof`).
# =============================================================================

project: disputatio

description: |
  Headless-оркестратор author↔reviewer debate loop по SPEC-001
  (disputatio-SPEC-001-round-protocol.md в корне репо — авторитетный дизайн).
  Реализация волны 1 влита; текущий прогон — доказательство того, что
  штатный `execution_mode: tdd` даёт полную цепочку RED → GREEN → review →
  трекаемая evidence в одной доставляемой истории.

repo_url: https://github.com/andrei-shtanakov/disputatio

# Пути ниже — операторские (user-relative через `~`, конвенция maestro:
# «absolute path or start with ~»). Это runtime-конфиг запуска оркестрации,
# не переносимый билд-артефакт, поэтому в CI конфиг проверяется без файлового
# яруса: `maestro validate project.yaml --strict --no-fs`. Это ограниченная
# проверка: `--no-fs` убирает файловый ярус целиком, и его находки
# (`scope-no-match`, repo sanity) не поднимаются вовсе — проверяется меньший
# набор условий, а не тот же набор мягче. Полная проверка — `maestro validate
# project.yaml --strict` на реальном дереве (D2 preflight, см. заголовок).
# Env-параметризация (${VAR}) сознательно НЕ используется: подстановка
# maestro fail-closed без синтаксиса дефолта — голый запуск ломался бы.
repo_path: ~/labs/all_ai_orchestrators/disputatio

# Сиблинг без точки и вне ignore-путей (INV-13; ловушка pyrefly в dot-каталогах)
workspace_base: ~/labs/all_ai_orchestrators/disputatio-ws

max_concurrent: 3

# INV-12 («master инструментам запрещён») действовал, пока была живая
# интеграционная ветка волны: `pilot/wave-1` удалена после мержа PR #11, и
# роль интеграционного состояния с тех пор играет master (WARN 3 транскрипта
# D5). Оставленная ссылка на удалённую ветку — не «строгая настройка», а
# отказ на старте: `maestro validate --strict` её не ловит (файловый ярус
# ветки не проверяет), а worktree создаётся именно от неё.
# Инструменты по-прежнему не пишут в master: работа идёт в `ws/<id>` и
# приезжает PR'ом.
base_branch: master

branch_prefix: "ws/"
auto_pr: true

spec_runner:
  max_retries: 3
  task_timeout_minutes: 30
  claude_command: claude
  auto_commit: true
  # A1 (Round 2): вложенные task-ветки в Mode 2 не нужны (изоляция —
  # worktree Maestro) и ломали бы стабильность evidence-неймспейса
  # (namespace вычисляется из ветки один раз — INV-16); branch --show-current
  # обязана оставаться `ws/<id>` на всём протяжении workstream'а.
  create_git_branch: false
  run_tests_on_done: true
  # Ровно ОДНА команда, без `&&`: `execution_mode: tdd` отвергает композитный
  # test_command до запуска чего-либо (`is_composite_shell_command` в
  # spec_runner/tdd.py) — реплей не может угадать, какой компонент `a && b`
  # принимает node id, и каждый red стал бы `unverifiable`. Прежняя обёртка
  # `tdd_gate.py verify && …` была primary edge локального гейта; штатный
  # RED-гейт отказывает раньше — на переходе `red_verifying → green_implementing`.
  # Полный suite, а не подмножество: narrowing включается только в parallel-режиме
  # spec-runner (`changed_since`), а maestro зовёт `spec-runner run --all` без него.
  test_command: "uv run pytest -q"
  run_lint_on_done: true
  lint_command: "uv run ruff check ."
  extra_executor_config:
    executor:
      on_task_failure: stop
      # Штатный TDD-контракт вместо локального гейта (D7-A → spec-runner#141).
      # Падающий тест авторствует отдельный RED-пас, его коммит реплеится в
      # одноразовом worktree, файл теста лочится побайтно, а без подтверждённого
      # red пас реализации не запускается вовсе.
      execution_mode: tdd
      # Объявлен, а не выведен: exit code реплея означает то, что говорит
      # конкретный раннер (pytest 1 = «тесты упали»), и инференс разрешён только
      # там, где не может ошибиться. Объявленный раннер, которого команда не
      # несёт, отвергается на загрузке конфига, а не логируется.
      tdd_runner: pytest
      # `tdd_namespace` НЕ объявлен намеренно: ключ один на весь project.yaml, а
      # неймспейс обязан быть свой у каждого workstream'а (INV-16) — одно
      # значение на всех склеило бы их claim'ы при схождении веток. Пустое
      # значение даёт хеш от пути worktree: изоляция верная, читаемость каталога
      # evidence теряется (открытый пункт в TODO.md).
      harness_guard: strict
      harness_files:
        # Штатный гейт — код установленного пакета: агенту его править нечем,
        # и защищать осталось только наше. Экспортёр evidence, плагины и сами
        # артефакты — новый harness-периметр.
        - scripts/tdd_evidence_export.py
        - spec/plugins
        - spec/evidence
        # Старый гейт остаётся в дереве страховкой до прогона-доказательства
        # (todo://disputatio/tdd-gate-migration-proof) — пока он здесь, он тоже
        # harness. Его post_done-плагин инертен в штатном режиме: `audit`
        # пропускает DONE-задачи без claim'а в `spec/.tdd-evidence/`.
        - scripts/tdd_gate.py
        - spec/.tdd-evidence/verdicts
        - spec/.tdd-evidence/waivers
        # Каталоги операторских remedy: `abandon`/`repair` пишут туда сами, и
        # правка агентом — подделка санкции оператора. Каталогов может не быть
        # на диске (remedy ещё не применялась) — снапшот берёт то, что есть.
        # Были в операторском конфиге и доках, но не в SSOT (Copilot, PR #32).
        - spec/.tdd-evidence/abandoned
        - spec/.tdd-evidence/repairs
        # N2 (Round 4): волна оставила конституцию свободно правимой —
        # regression против «автор не правит свой оракул» (агент, которому
        # неудобна TDD-дисциплина, мог бы просто отредактировать п.1-5).
        - spec/maestro-constitution.md

workstreams:
  # Один workstream: прогон-доказательство миграции. Задача выбрана из
  # настоящего долга репо (TODO в `src/disputatio/verifier/diffstats.py`), а
  # не выдумана ради прогона, и относится ровно к тому классу дефектов,
  # который ступень уже дважды закрывала в других местах: «инструмент не смог
  # ответить» нельзя читать как факт о дереве.
  - id: w-proof
    title: "Verifier: отличить сбой git от «изменений нет» в diff-статистике"
    description: |
      Закрыть TODO в `src/disputatio/verifier/diffstats.py`
      (`collect_diff_stats`). Сейчас ЛЮБОЙ ненулевой код возврата
      `git diff --numstat HEAD` возвращает `DiffStats(0, 0, 0)`, поэтому
      «в репозитории нет коммитов» (bad revision 'HEAD' — законные нули по
      DESIGN-008) неотличимо от «not a git repository», bare-репозитория и
      недоступного `.git`. Диагностика при этом гасится в DEVNULL.

      Требуемое поведение: репозиторий без коммитов по-прежнему даёт
      `DiffStats(0, 0, 0)`; любой другой сбой git наружу как отказ с текстом
      git, а не как пустой diff. Отсутствующий бинарь уже уходит
      `FileNotFoundError` — это поведение не менять. stderr больше не гасить
      целиком: он нужен, чтобы отличить случаи, но и в stdout его подмешивать
      нельзя (строки станут неотличимы от numstat'а).

      Границы: правится ТОЛЬКО `collect_diff_stats` и его тесты. Парсер
      `_parse_numstat`/`_count`, контракт `DiffStats` и остальные модули
      verifier не трогать. Обновить TODO-комментарий, раз он закрыт.

      Декомпозиция: РОВНО ОДНА leaf-задача. Это прогон-доказательство
      миграции, а не волна: дробить не нужно.

      RED-тест писать в `tests/verifier/test_<TASK>_red.py` — в пакете
      тестов verifier, НЕ в корне `tests/`.

      Приёмка: `uv run pytest -q` (полный suite) зелёный.
    scope:
      - "src/disputatio/verifier/diffstats.py"
      - "tests/verifier/**"
      # Временная страховка ТОЛЬКО для w-proof: встроенный промпт RED-паса
      # предлагает `tests/test_<task>_red.py`, то есть корень `tests/`, а
      # `is_discoverable` каталог не проверяет — инструкция в описании задачи
      # направляет, но инвариантом не является. Глоб намеренно `test_*.py`, а
      # не `test_*_red.py`: второй не матчит ни одного существующего файла и
      # роняет `validate --strict` предупреждением `scope-no-match`, а создать
      # файл-заглушку нельзя — red в предсуществующем файле отвергается
      # (`_refuse_pre_existing_file`). Снять после системного фикса у соседа
      # (RED-путь настраиваемый или scope-aware).
      - "tests/test_*.py"
      # Артефакт экспортёра едет в том же PR, а orchestrator-managed для
      # scope-гейта — только `spec/maestro-*`, `spec/.maestro-*` и
      # `spec/.executor-*` (`maestro/changed_paths.py`). Без этой строки
      # evidence прочиталась бы как scope escape.
      - "spec/evidence/**"
    depends_on: []
    priority: 10
