# =============================================================================
# disputatio — Maestro Mode-2 конфигурация (рукописная)
# =============================================================================
# SSOT для worktree-конфигов: spec-runner.config.yaml генерируется Maestro
# в каждом worktree из блока spec_runner ниже и НЕ трекается (dual-mode
# contract). Оракул декомпозиции: docs/plans/D1-decomposition-invariants.md.
#
# Запуск:
#   maestro validate project.yaml --strict   # preflight
#   maestro orchestrate project.yaml         # прогон
#
# СОСТАВ WORKSTREAM'ОВ = ТЕКУЩАЯ ВОЛНА, а не история. `orchestrate` не умеет
# фильтровать по workstream'у (в CLI такого флага нет) и берёт весь список,
# поэтому конфиг описывает то, что гоним сейчас. Волна 1 (семь workstream'ов,
# 100 задач) закрыта и влита PR #11; её состав — в git-истории этого файла
# (до коммита cutover'а) и в транскриптах `docs/plans/`. Текущая волна —
# прогон-доказательство миграции TDD-гейта на штатный режим
# (`todo://disputatio/tdd-gate-migration-proof`).
# =============================================================================

project: disputatio

description: |
  Headless-оркестратор author↔reviewer debate loop по SPEC-001
  (disputatio-SPEC-001-round-protocol.md в корне репо — авторитетный дизайн).
  Реализация волны 1 влита; текущий прогон — доказательство того, что
  штатный `execution_mode: tdd` даёт полную цепочку RED → GREEN → review →
  трекаемая evidence в одной доставляемой истории.

repo_url: https://github.com/andrei-shtanakov/disputatio

# Пути ниже — операторские (user-relative через `~`, конвенция maestro:
# «absolute path or start with ~»). Это runtime-конфиг запуска оркестрации,
# не переносимый билд-артефакт, поэтому в CI конфиг проверяется без файлового
# яруса: `maestro validate project.yaml --strict --no-fs`. Это ограниченная
# проверка: `--no-fs` убирает файловый ярус целиком, и его находки
# (`scope-no-match`, repo sanity) не поднимаются вовсе — проверяется меньший
# набор условий, а не тот же набор мягче. Полная проверка — `maestro validate
# project.yaml --strict` на реальном дереве (D2 preflight, см. заголовок).
# Env-параметризация (${VAR}) сознательно НЕ используется: подстановка
# maestro fail-closed без синтаксиса дефолта — голый запуск ломался бы.
repo_path: ~/labs/all_ai_orchestrators/disputatio

# Сиблинг без точки и вне ignore-путей (INV-13; ловушка pyrefly в dot-каталогах)
workspace_base: ~/labs/all_ai_orchestrators/disputatio-ws

max_concurrent: 3

# `base_branch` управляет ДВУМЯ вещами сразу, и развести их нельзя:
# базой PR (`pr_manager`: `gh pr create --base <base_branch>`) и локальным
# мержем ветки workstream'а в главном репо (`orchestrator._merge_into_base`,
# безусловный — DONE гейтится успешным мержем, флага отключения нет).
#
# Отсюда двухрежимное правило, вместо прежнего «master инструментам запрещён»:
#
# * **Волна (>1 workstream)** — интеграционная ветка, как INV-12 волны 1
#   (`docs/plans/D1-decomposition-invariants.md`): семь workstream'ов не
#   должны лить семь PR в master, а мерж в base нужен, чтобы следующий
#   workstream видел предыдущую работу.
# * **Одиночный прогон** (наш случай — `w-proof`) — `master`, и это
#   осознанно: PR должен целиться в master, чтобы код и evidence проходили
#   обычное ревью. Плата — maestro продвигает ЛОКАЛЬНЫЙ master на коммиты
#   ветки (origin не трогается). Пост-шаг прогона обязателен и начинается с
#   переключения ветки, а не со сброса:
#     git switch master && git fetch origin
#     # вердикт, а не два SHA на глаз:
#     test "$(git rev-parse master)" = "$(git rev-parse origin/master)" \
#       && echo "master чист" || echo "РАСХОЖДЕНИЕ"
#     git reset --hard origin/master   # только при расхождении и только на master
#   Порядок не косметический: тот же `reset --hard` на `ws/<id>` снёс бы
#   ветку прогона вместе с red-коммитом. И сверять надо именно SHA: пока PR
#   не смержен, локальный master просто ВПЕРЕДИ origin, а `git pull --ff-only`
#   на это отвечает «Already up to date» с кодом 0 (проверено). Громкий отказ
#   приходит только после мержа PR, когда истории разойдутся, — позже и не
#   там, где ошибка возникла.
#
# Наблюдено на прогоне 2026-08-22 (`docs/plans/2026-08-22-tdd-migration-proof-transcript.md`).
base_branch: master

branch_prefix: "ws/"
auto_pr: true

spec_runner:
  max_retries: 3
  task_timeout_minutes: 30
  claude_command: claude
  auto_commit: true
  # A1 (Round 2): вложенные task-ветки в Mode 2 не нужны (изоляция —
  # worktree Maestro) и ломали бы стабильность evidence-неймспейса
  # (namespace вычисляется из ветки один раз — INV-16); branch --show-current
  # обязана оставаться `ws/<id>` на всём протяжении workstream'а.
  create_git_branch: false
  run_tests_on_done: true
  # Ровно ОДНА команда, без `&&`: `execution_mode: tdd` отвергает композитный
  # test_command до запуска чего-либо (`is_composite_shell_command` в коде
  # соседа, spec-runner: `src/spec_runner/tdd.py`) — реплей не может угадать,
  # какой компонент `a && b`
  # принимает node id, и каждый red стал бы `unverifiable`. Штатный RED-гейт
  # отказывает на переходе `red_verifying → green_implementing`, то есть до
  # реализации, а не на стадии тестов.
  # Полный suite, а не подмножество: narrowing включается только в parallel-режиме
  # spec-runner (`changed_since`), а maestro зовёт `spec-runner run --all` без него.
  test_command: "uv run pytest -q"
  run_lint_on_done: true
  lint_command: "uv run ruff check ."
  extra_executor_config:
    executor:
      on_task_failure: stop
      # Штатный TDD-контракт вместо локального гейта (D7-A → spec-runner#141).
      # Падающий тест авторствует отдельный RED-пас, его коммит реплеится в
      # одноразовом worktree, файл теста лочится побайтно, а без подтверждённого
      # red пас реализации не запускается вовсе.
      execution_mode: tdd
      # Объявлен, а не выведен: exit code реплея означает то, что говорит
      # конкретный раннер (pytest 1 = «тесты упали»), и инференс разрешён только
      # там, где не может ошибиться. Объявленный раннер, которого команда не
      # несёт, отвергается на загрузке конфига, а не логируется.
      tdd_runner: pytest
      # Без этого прогон 2026-08-22 упал на нашем же экспортёре: он требует
      # вердикт гейта `review`, а под дефолтным `advisory` гейт **не
      # регистрируется вовсе** (spec-runner, `gates.register_builtin_gates`) —
      # вердикта нет, цепочка неполна, fail-closed отказ. Требовать в артефакте
      # то, чего конфигурация не производит, — дефект нашей стороны, и чинится
      # он здесь: для сертификационной ступени ревью, которое не может задержать
      # завершение, гейтом не является (spec-runner#138 — ровно этот класс).
      # `review_policy` входит в POLICY_KEYS, поэтому его смена протухляет
      # прежние вердикты: после правки нужен ЧИСТЫЙ прогон, а не продолжение.
      review_policy: required
      # `tdd_namespace` НЕ объявлен намеренно: ключ один на весь project.yaml, а
      # неймспейс обязан быть свой у каждого workstream'а (INV-16) — одно
      # значение на всех склеило бы их claim'ы при схождении веток. Пустое
      # значение даёт хеш от пути worktree: изоляция верная, читаемость каталога
      # evidence теряется (открытый пункт в TODO.md).
      harness_guard: strict
      harness_files:
        # Штатный гейт — код установленного пакета: агенту его править нечем,
        # и защищать осталось только наше. Экспортёр evidence, плагины и сами
        # артефакты — новый harness-периметр.
        # Control plane: сама политика и послабления typecheck. Дефолтный
        # HARNESS_CANDIDATES spec-runner'а не включает ни то, ни другое, а
        # агент в worktree технически может править оба (spec-runner#137).
        # Guard хеширует файлы на диске, а не через git, поэтому покрывает и
        # неотслеживаемый `spec-runner.config.yaml`: maestro пишет его в
        # worktree один раз до запуска (`workspace.py`), и во время задачи
        # законных записей в него нет.
        - spec-runner.config.yaml
        - pyrefly.toml
        - scripts/tdd_evidence_export.py
        - spec/plugins
        - spec/evidence
        # `scripts/tdd_gate.py` из списка убран вместе с самим гейтом
        # (прогон-доказательство пройден, `todo://disputatio/tdd-gate-migration-proof`).
        # Каталоги `spec/.tdd-evidence/**` остаются под защитой, хотя писать в
        # них больше некому: это исторические артефакты сертификации волны 1
        # (208 файлов claims/verdicts/waivers), и агент не должен их править —
        # ни задним числом дописать вердикт, ни «прибраться».
        # `claims` в списке не было, и до сноса это было верно: гейт писал
        # туда сам, каталог обязан был оставаться доступным на запись. Гейта
        # нет — 100 файлов claims стали таким же архивом, как остальные три
        # каталога, и без этой строки их можно было переписать молча.
        - spec/.tdd-evidence/claims
        - spec/.tdd-evidence/verdicts
        - spec/.tdd-evidence/waivers
        - spec/.tdd-evidence/abandoned
        - spec/.tdd-evidence/repairs
        # N2 (Round 4): волна оставила конституцию свободно правимой —
        # regression против «автор не правит свой оракул» (агент, которому
        # неудобна TDD-дисциплина, мог бы просто отредактировать п.1-5).
        - spec/maestro-constitution.md
        # RED-тесты закрытых волн в корне `tests/` — заморожены поимённо, без
        # глоба: scope workstream'а пускает под `tests/test_*_red.py` (там
        # spec-runner кладёт RED-тест волны), а этот глоб захватывает и их.
        # Запрет на их правку держит этот список, а не scope; глоб здесь
        # закрыл бы и новый RED-тест волны, и RED-пас не смог бы его записать.
        - tests/test_task_002_red.py
        - tests/test_task_003_red.py
        - tests/test_task_004_red.py
        - tests/test_task_005_red.py
        - tests/test_ws57_task_001_red.py
        - tests/test_ws57_task_002_red.py
        - tests/test_ws57_task_005_red.py
        - tests/test_ws57_task_011_red.py
        - tests/test_ws57_task_014_red.py
        - tests/test_ws57_task_015_red.py
        - tests/test_ws65_task_001_red.py
        # RED-тест прогона-доказательства 2026-08-22: под scope он попадает не
        # глобом `_red`, а через `tests/verifier/**`, и заморожен так же.
        # Соседний `tests/verifier/conftest.py` в scope и не заморожен (общие
        # фикстуры verifier законно правятся), поэтому снятие файла с коллекции
        # или пропуск ловит третий слой: хук корневого `tests/conftest.py`
        # (вне scope) при полном прогоне требует, чтобы каждый архивный тест
        # был собран и прошёл.
        - tests/verifier/test_task_001_red.py
        # Пин sha256 этих 12 файлов — второй, независимый от базы guard'а слой;
        # пины и правило «собран и прошёл» — в `tests/frozen_red_archive.py`.
        - tests/frozen_red_archive.py
        - tests/test_frozen_red_archive.py
        # Носитель правила «архивный RED собран и прошёл» (хук, ревью #152):
        # дефолтный `HARNESS_CANDIDATES` spec-runner'а берёт только корневой
        # `conftest.py`, а не `tests/conftest.py`.
        - tests/conftest.py

workstreams:
  # Один workstream: прогон-доказательство миграции. Задача выбрана из
  # настоящего долга репо (TODO в `src/disputatio/verifier/diffstats.py`), а
  # не выдумана ради прогона, и относится ровно к тому классу дефектов,
  # который ступень уже дважды закрывала в других местах: «инструмент не смог
  # ответить» нельзя читать как факт о дереве.
  - id: w-proof
    title: "Verifier: отличить сбой git от «изменений нет» в diff-статистике"
    description: |
      Закрыть TODO в `src/disputatio/verifier/diffstats.py`
      (`collect_diff_stats`). Сейчас ЛЮБОЙ ненулевой код возврата
      `git diff --numstat HEAD` возвращает `DiffStats(0, 0, 0)`, поэтому
      «в репозитории нет коммитов» (bad revision 'HEAD' — законные нули по
      DESIGN-008) неотличимо от «not a git repository», bare-репозитория и
      недоступного `.git`. Диагностика при этом гасится в DEVNULL.

      Требуемое поведение: репозиторий без коммитов по-прежнему даёт
      `DiffStats(0, 0, 0)`; любой другой сбой git наружу как отказ с текстом
      git, а не как пустой diff. Отсутствующий бинарь уже уходит
      `FileNotFoundError` — это поведение не менять. stderr больше не гасить
      целиком: он нужен, чтобы отличить случаи, но и в stdout его подмешивать
      нельзя (строки станут неотличимы от numstat'а).

      Границы: правится ТОЛЬКО `collect_diff_stats` и его тесты. Парсер
      `_parse_numstat`/`_count`, контракт `DiffStats` и остальные модули
      verifier не трогать. Обновить TODO-комментарий, раз он закрыт.

      Декомпозиция: РОВНО ОДНА leaf-задача. Это прогон-доказательство
      миграции, а не волна: дробить не нужно.

      КОДЫ ВОЗВРАТА GIT ИЗМЕРЕНЫ, НЕ УГАДЫВАЮТСЯ. Вне репозитория
      `git diff --numstat HEAD` завершается с кодом **129**: это usage-ошибка
      fallback'а `--no-index` (ему нужно два пути, а дан один — `HEAD`), а не
      fatal 128. Код 128 даёт, например, зонд `rev-parse` на битом `GIT_DIR`.
      Ассерт на конкретное число разрешён только для того числа, которое
      выдаёт ИМЕННО проверяемая команда в ИМЕННО этом состоянии; проверить
      фактическим запуском до того, как писать ассерт. Прогон 2026-08-22
      заблокировался ровно здесь: red захардкодил 128, реализация честно
      выдавала 129, и залоченный тест стало нельзя ни удовлетворить, ни
      исправить без операторского вмешательства.

      Приёмка: `uv run pytest -q` (полный suite) зелёный.
    scope:
      - "src/disputatio/verifier/diffstats.py"
      - "tests/verifier/**"
      # RED-тест задачи: его путь предписывает сосед, а не описание задачи.
      # spec-runner 4.x кладёт evidential-тест в `tests/test_<task>_<ns>_red.py`
      # в корне `tests/` (`spec_runner/tdd_runners.py::evidential_file`,
      # TASK-009 / #366); каталог фиксирован намеренно — так evidence всегда
      # знает, какой файл тест. Глоб `tests/test_*_red.py` повторяет ровно то,
      # что сосед гарантирует (корень `tests/`, префикс `test_`, суффикс
      # `_red.py`); шаблон уже этого держался бы на формате task-id, которого
      # `task_slug` не обещает. Без глоба прогон 2026-09-26 упал в scope escape
      # на исправной задаче (`docs/plans/2026-09-26-remedy-path-proof-transcript.md`);
      # широкий `tests/test_*.py`, снятый 2026-08-22, не возвращается.
      #
      # Две зависимости глоба:
      # - он захватывает и 11 RED-тестов закрытых волн в корне `tests/`; запрет
      #   на их правку держит не scope, а два слоя: `harness_guard: strict`
      #   (файлы поимённо в `harness_files` выше; база одна на задачу в
      #   пределах процесса spec-runner, но новый процесс — повтор maestro или
      #   `--resume` — снимает её заново) и пин sha256
      #   `tests/test_frozen_red_archive.py`, который краснит приёмочный
      #   `uv run pytest -q` на любой их правке (тем же способом заморожен и
      #   `tests/verifier/test_task_001_red.py`, входящий в scope через
      #   `tests/verifier/**`);
      # - `maestro validate --strict` зелёный только благодаря этим 11 файлам:
      #   без них глоб ничего не матчит, и preflight падает на
      #   `scope-no-match`. Штатное исключение (`expected_outputs` доменного
      #   профиля, `maestro/preflight.py::_is_expected_output`) рассмотрено и
      #   не взято: доменного профиля ради одного предупреждения не заводим.
      - "tests/test_*_red.py"
      # Артефакт экспортёра едет в том же PR, а orchestrator-managed для
      # scope-гейта — только `spec/maestro-*`, `spec/.maestro-*` и
      # `spec/.executor-*` — это код соседа, maestro:
      # `maestro/changed_paths.py`, не файл этого репо. Без этой строки
      # evidence прочиталась бы как scope escape.
      - "spec/evidence/**"
    depends_on: []
    priority: 10
